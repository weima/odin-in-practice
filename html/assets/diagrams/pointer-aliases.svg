<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="pointer-title pointer-desc"><style>svg{background:#fff;color:#5366a9}.box{fill:#eef2ff;stroke:#95a5bf;stroke-width:2}.flow{fill:none;stroke:#5366a9;stroke-width:3}.label{fill:#172033;font:600 18px Arial,sans-serif}.note{fill:#526073;font:15px Arial,sans-serif}</style>
<title id="pointer-title">Two pointer copies name one integer</title><desc id="pointer-desc">Pointer variables p and q both point to count. Changing the target through either pointer changes count. An independent integer copy has separate storage and keeps its original value.</desc>
<defs><marker id="pointer-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<rect class="box" x="20" y="25" width="190" height="70" rx="10"/><text class="label" x="40" y="55">p: ^int</text><text class="note" x="40" y="79">address of count</text>
<rect class="box" x="20" y="140" width="190" height="70" rx="10"/><text class="label" x="40" y="170">q := p</text><text class="note" x="40" y="194">same address</text>
<rect class="box" x="370" y="80" width="190" height="80" rx="10"/><text class="label" x="390" y="112">count</text><text class="note" x="390" y="139">41 → 42 via p^</text>
<path class="flow" d="M215 60 H295 V105 H358" marker-end="url(#pointer-arrow)"/><path class="flow" d="M215 175 H295 V140 H358" marker-end="url(#pointer-arrow)"/>
<rect class="box" x="680" y="80" width="195" height="80" rx="10"/><text class="label" x="700" y="112">copy: int</text><text class="note" x="700" y="139">still 41</text>
</svg>
