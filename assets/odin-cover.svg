<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Odin: a mythological codename that became a programming language</title>
  <desc id="description">An original editorial illustration of a cloaked, one-eyed Odin with two ravens. On the right, a page of Odin code connects the mythological name to the language. The caption reads: A codename that stuck. The image does not imply that mythology determined the language design.</desc>
