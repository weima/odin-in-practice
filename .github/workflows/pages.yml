name: Build and publish the book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked publishing dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          npm ci
      - name: Render Mermaid diagrams to offline SVGs
        run: npm run diagrams
      - name: Build HTML from Markdown
        run: mkdocs build --strict
      - name: Check the generated book
        run: python tools/check-book.py
      - name: Package the offline reader
        run: python tools/package-offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: odin-in-practice-offline
          path: html/odin-in-practice-offline.zip
      - uses: actions/upload-pages-artifact@v4
        with:
          path: html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the freshly built HTML
        id: deployment
        uses: actions/deploy-pages@v4
