name: Build and publish the book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Installed Chrome uses Ubuntu's supported sandbox, unlike the cached test build.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      ODIN_RELEASE: dev-2026-10
      JUST_RELEASE: 1.58.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked publishing dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          npm ci
      - name: Install pinned Odin release
        run: |
          archive="$RUNNER_TEMP/odin.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_RELEASE}/odin-linux-amd64-${ODIN_RELEASE}.tar.gz"
          printf '%s  %s\n' \
            'c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab' \
            "$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/odin"
          odin="$(find "$RUNNER_TEMP/odin" -maxdepth 4 -type f -name odin -print -quit)"
          test -x "$odin"
          echo "$(dirname "$odin")" >> "$GITHUB_PATH"
          "$odin" version
      - name: Install pinned just release
        run: |
          archive="$RUNNER_TEMP/just.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/casey/just/releases/download/${JUST_RELEASE}/just-${JUST_RELEASE}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' \
            '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d' \
            "$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/just"
          tar -xzf "$archive" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/just/just" --version
      # The justfile is the single list of checks, so CI and a local `just verify` agree.
      - name: Check book Odin packages
        run: just check
      - name: Run book Odin tests
        run: just test
      - name: Check and run Odin companion skill examples
        run: just skill-examples
      - name: Render Mermaid diagrams to offline SVGs
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm run diagrams
      - name: Package and verify the companion skill
        run: python tools/package-skill.py
      - name: Build HTML from Markdown
        run: mkdocs build --strict
      - name: Check the generated book
        run: just check-book
      - name: Package the offline reader
        run: python tools/package-offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: odin-in-practice-offline
          path: html/odin-in-practice-offline.zip
      - uses: actions/upload-pages-artifact@v4
        with:
          path: html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the freshly built HTML
        id: deployment
        uses: actions/deploy-pages@v4
